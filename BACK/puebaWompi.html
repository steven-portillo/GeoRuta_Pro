<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba Wompi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
    button { margin-top: 1rem; width: 100%; padding: 0.75rem; cursor: pointer; }
    #formWompi { margin-top: 1.5rem; min-height: 60px; }
    #log { margin-top: 1rem; background: #f4f4f4; padding: 0.75rem; border-radius: 8px; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Prueba Wompi</h1>

  <label>ID producto <input type="number" id="id_producto" value="1" /></label>
  <label>Cantidad <input type="number" id="cantidad" value="1" min="1" /></label>
  <label>ID empresa <input type="number" id="id_empresa" value="1" /></label>

  <button type="button" id="btnPreparar">1. Preparar pago</button>

  <div id="formWompi"></div>
  <pre id="log"></pre>

  <script>
    const API = "http://localhost:8005";

    document.getElementById("btnPreparar").onclick = async () => {
      const log = document.getElementById("log");
      const formBox = document.getElementById("formWompi");
      formBox.innerHTML = "";
      log.textContent = "Llamando API...";

      const body = {
        id_producto: Number(document.getElementById("id_producto").value),
        cantidad: Number(document.getElementById("cantidad").value),
        id_empresa: Number(document.getElementById("id_empresa").value),
      };

      try {
        const res = await fetch(`${API}/pagos/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        log.textContent = JSON.stringify(data, null, 2);

        if (!data.success) {
          alert(data.message || "Error checkout");
          return;
        }

        // Crear form + script de forma que SÍ se ejecute
        const form = document.createElement("form");
        const script = document.createElement("script");
        script.src = "https://checkout.wompi.co/widget.js";
        script.setAttribute("data-render", "button");
        script.setAttribute("data-public-key", data.publicKey);
        script.setAttribute("data-currency", data.currency);
        script.setAttribute("data-amount-in-cents", String(data.amountInCents));
        script.setAttribute("data-reference", data.reference);
        script.setAttribute("data-signature:integrity", data.signature);

        form.appendChild(script);
        formBox.appendChild(form);
      } catch (e) {
        log.textContent = String(e);
      }
    };
  </script>
</body>
</html>
